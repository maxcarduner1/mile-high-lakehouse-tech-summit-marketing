# Databricks App manifest — read by the runtime when the container starts.
#
# This is the TEMPLATE app.yaml. scripts/finalize_app.sh renders the deployed
# app.yaml from it: keeps this header + command + scopes + binding-derived env,
# and appends the plain-value env vars (DEMO_CATALOG, DASHBOARD_ID,
# GENIE_SPACE_ID, …) harvested from the setup job's export_resources output.
# Plain values live in exactly one place (finalize_app.sh), assembled after
# the job runs — the bundle can't know the Genie/KA/MAS IDs at deploy time.
# Binding-derived vars (DATABRICKS_WAREHOUSE_ID, LAKEBASE_ENDPOINT) stay here.
#
# Lifecycle on the Apps container (in order):
#   1. `npm install` against the shipped lockfile.
#   2. `npm run build` (no-op echo — real build runs locally via
#      scripts/build-app.sh and dist/ ships via DAB sync.include).
#   3. The `command:` below starts the server.

command: ['node', '--env-file-if-exists=.env', 'dist/server.js']

# Scopes minted into the user's OBO token (x-forwarded-access-token).
user_authorization:
  scopes:
    - model-serving      # OpenAI Agents loop hits /serving-endpoints/responses
    - genie              # ask_data → Genie space
    - sql                # warehouse-backed analytics queries
    - postgres           # Lakebase pool
    - ai-gateway         # AI Gateway routing for the Responses API
    - catalog.catalogs:read
    - catalog.schemas:read
    - catalog.tables:read

env:
  - name: NODE_ENV
    value: production

  # ── Binding-derived ─────────────────────────────────────────────────
  # AppKit's ResourceRegistry expects DATABRICKS_WAREHOUSE_ID and the
  # standard PG* vars from the postgres binding (PGHOST/PGDATABASE/PGUSER
  # /PGPORT/PGSSLMODE are auto-injected by the platform).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # Mirror DATABRICKS_WAREHOUSE_ID into WAREHOUSE_ID for config/app.json
  # placeholder resolution.
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse

  # ── Plain-value env (config/app.json placeholders) ──────────────────────
  # Normally finalize_app.sh harvests these from the setup job's exit JSON and
  # writes them here post-run. Because this app is deployed straight from the
  # DAB (no setup-job harvest in this workspace), the concrete IDs for the
  # fe-sandbox-serverless-sandbox-kgi5wi workspace are pinned as literals.
  # ⚠️ When forking for another workspace, re-render these (or run
  #    finalize_app.sh). The bundle can NOT ${var}-substitute a source app.yaml.
  - name: DEMO_CATALOG
    value: "serverless_sandbox_kgi5wi_catalog"
  - name: DEMO_SCHEMA
    value: "brightwave"
  # ask_data backend → Genie space (Brightwave uses Genie; MAS left empty).
  - name: GENIE_SPACE_ID
    value: "01f1a23cb2351042be83c6d1f552fa67"
  # Embedded AI/BI campaign-performance dashboard.
  - name: DASHBOARD_ID
    value: "01f1a23d02001faab2184ad40dce0b8b"
  # SDP pipeline (brightwave_campaign_360) → PlatformDiagram deep-link tile.
  - name: PIPELINE_ID
    value: "ff86c416-9b67-495b-8c84-0d95f1b9ba07"
  # Lakebase project slug (deep-link tile). NB: slug is "birghtwave".
  - name: LAKEBASE_PROJECT_ID
    value: "birghtwave"
  # Public app URL (self-referential deep links).
  - name: APP_URL
    value: "https://brightwave-7474656564440949.aws.databricksapps.com"
