# Databricks Asset Bundle — Brightwave (Campaign Replication & Budget Rescue).
#
# This bundle provisions the Brightwave workspace resources AND deploys the
# Brightwave Campaign Desk app:
#   • schema + a raw-data Volume,
#   • the data-gen job (generates the synthetic raw_* parquet datasets),
#   • the `brightwave` Databricks App (AppKit Node/TS, source in ./app) with its
#     sql-warehouse binding + Lakebase `postgres` binding (development branch) +
#     env (see the `apps.brightwave` block below). Command + OBO scopes live in
#     app/app.yaml, which the container reads at boot.
#
# The pipeline, metric view, ML model, dashboard, and Genie space are still the
# trainee's graded milestones (see README.md + app/APP_WORKSHOP.md); this bundle
# does not build those.
#
# ⚠️ Deploying this bundle as-is CREATES a new app. To update the EXISTING
#    `brightwave` app instead, `bundle deployment bind` it once first — see the
#    Deploy runbook in DEPLOY.md. Do NOT run deploy/bind as part of authoring.
bundle:
  name: workshop-brightwave

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/brightwave-workshop

# Force-ship the app's built artifacts even though they're gitignored. The app
# is DESIGNED to build LOCALLY (scripts/build-app.sh) and ship the prebuilt
# bundle to the Apps container (app.yaml header); dist/, client/dist/, and the
# drizzle/ migrations are gitignored, so DAB's default git-aware sync skips
# them. Without this the container tries to rebuild and fails (tsdown is a
# devDependency, absent from the container's production install).
sync:
  include:
    - app/dist/**
    - app/client/dist/**
    - app/drizzle/**

variables:
  catalog:
    description: Unity Catalog for the workshop data (must already exist / you can create it).
    default: dbdemos_templates
  schema:
    description: Schema for the demo tables + the raw_data volume (created by this bundle).
    default: brightwave

  # ── App resource bindings ────────────────────────────────────────────────
  # Template-safe empty defaults so this bundle still validates in any
  # workspace; the concrete IDs are injected per-target (see targets.dev).
  warehouse_id:
    description: SQL warehouse the app's `sql-warehouse` resource binds to.
    default: ""
  lakebase_branch:
    description: >-
      Lakebase (Autoscaling) branch resource path the app's `postgres` binding
      connects to, e.g. projects/<proj>/branches/<branch>.
    default: ""
  lakebase_database:
    description: >-
      Lakebase database resource path under that branch, e.g.
      projects/<proj>/branches/<branch>/databases/<db>.
    default: ""

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Workshop — Brightwave campaign-replication: synthetic marketing campaign data."

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.demo_schema.name}
      name: raw_data
      volume_type: MANAGED
      comment: "Raw parquet landing zone — generate_data.py writes here; the SDP silver you build reads it via read_files()."

  jobs:
    brightwave_setup:
      name: "[Workshop] Brightwave — generate data"
      description: "Generates the synthetic raw_* parquet datasets into the raw_data volume. Run this once after deploy, then build the pipeline/Lakebase/app/gateway yourself."
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./data_generation/generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.demo_schema.name}
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "5"
            dependencies:
              - numpy
              - pandas
              - faker

    # ── The DEFINED TRIGGER (Build-2 Layer-1) ─────────────────────────────────
    # A scheduled serverless job that fires on its own (system update, not a
    # person opening the view) and leaves a timestamped `trigger` row in the
    # Lakebase workflow-state / observability table (`app.workflow_state`).
    # Together with the `decision` rows the app writes when a user commits an
    # action, this is the source for the `state_table.json` evidence artifact.
    #
    # Cadence: every 15 minutes (quartz cron). The task refreshes the ranked
    # view's Gold source (reads current row counts) and INSERTs the trigger row
    # into Lakebase directly (OAuth cred + psycopg2) — see the notebook header
    # for why we do NOT reuse the app's destructive /api/admin/reset endpoint.
    #
    # NB on pausing: DAB `mode: development` (targets.dev) auto-PAUSES all
    # schedules on deploy so dev deploys don't fire background jobs unexpectedly
    # — and it explicitly REFUSES a `presets.trigger_pause_status: UNPAUSED`
    # override. So after `bundle deploy -t dev`, unpause this one job for the
    # demo with:
    #   databricks jobs list --profile kgi5wi | grep 'scheduled refresh'   # get <job-id>
    #   databricks jobs update <job-id> --json '{"new_settings":{"schedule":{"quartz_cron_expression":"0 0/15 * * * ?","timezone_id":"UTC","pause_status":"UNPAUSED"}}}' --profile kgi5wi
    # (Deploying to `prod` — mode: production — honors the UNPAUSED below as-is.)
    brightwave_refresh:
      name: "[Workshop] Brightwave — scheduled refresh (defined trigger)"
      description: "The Build-2 defined trigger: fires every 15 min, refreshes the ranked view source, and writes a timestamped trigger row into app.workflow_state (Lakebase)."
      # Run as the app service principal so it owns/can-write app.workflow_state
      # without an extra grant. Left commented for the template (no SP id here);
      # the orchestrator sets this at deploy, or grants INSERT to the job's
      # identity (see notebook footer). NOTE: the running demo is unblocked via
      # the grant path — the app SP granted the deploying user USAGE ON SCHEMA app
      # + INSERT,SELECT ON app.workflow_state — so run_as is NOT needed here (and
      # binding it would require servicePrincipal.user on the SP at deploy time).
      # run_as:
      #   service_principal_name: <app-sp-application-id>
      schedule:
        # Every 15 minutes, on the quarter hour, UTC.
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: refresh_workflow_state
          notebook_task:
            notebook_path: ./resources/refresh_job/refresh_workflow_state.py
            base_parameters:
              catalog: ${var.catalog}
              # Use the literal ${var.schema} (the real data schema holding the
              # Build-1 synced Gold tables), NOT ${resources.schemas.demo_schema.name}:
              # in `mode: development` DAB name-prefixes managed resources, so the
              # latter resolves to `dev_<user>_brightwave` — a schema with no Gold
              # tables — making _safe_count read a missing table and stamp null
              # rowCounts. The trigger reads the shared Gold schema, so bind the
              # unmangled name.
              schema: ${var.schema}
              lakebase_endpoint: ${var.lakebase_branch}/endpoints/primary
              pg_database: databricks_postgres
          environment_key: refresh_env
      environments:
        - environment_key: refresh_env
          spec:
            client: "5"
            dependencies:
              - databricks-sdk
              # pg8000 (pure-Python PG driver), NOT psycopg2-binary: any wheel that
              # bundles a native libpq SIGABRTs the serverless kernel at import time
              # (libpq/OpenSSL symbol clash with the Spark process). See the notebook
              # header for the full diagnosis.
              - pg8000

  # ── Databricks App: Brightwave Campaign Desk ───────────────────────────────
  # Deploys the existing `brightwave` App (AppKit Node/TS, source in ./app) and
  # wires its platform resource bindings + OBO user API scopes.
  #
  # OBO scopes (`user_api_scopes`) MUST be set on the App object here in the
  # bundle (or via `databricks apps update`). A `user_authorization.scopes`
  # block in app/app.yaml is silently ignored — app.yaml only supports
  # `command` + `env`. So: scopes live here on the app resource; command/env
  # stay in app/app.yaml (read by the container at boot). Do not put a
  # `config:` block in both places — that conflicts.
  #
  # The two resource bindings below inject the standard env the AppKit
  # ResourceRegistry expects: `sql-warehouse` → DATABRICKS_WAREHOUSE_ID;
  # `postgres` → the PG* connection vars (PGHOST/PGDATABASE/PGUSER/PGPORT/
  # PGSSLMODE) + LAKEBASE_ENDPOINT. app.yaml maps those via valueFrom.
  #
  # NOTE (per databricks-lakebase skill): use the `postgres` resource key
  # (branch + database resource paths), NOT the retired `database` key. DABs
  # `synced_database_tables` is deprecated and is NOT declared here — the
  # Brightwave synced Gold tables are owned by the Build-1 owner (Angela) and
  # the app's server/db/sync.ts mirrors Delta→Lakebase at boot.
  apps:
    brightwave:
      name: brightwave
      description: "Brightwave Campaign Desk — campaign-replication & budget-rescue action-taking app."
      source_code_path: ./app
      # OBO scopes minted into x-forwarded-access-token (App object field).
      user_api_scopes:
        - ai-gateway
        - model-serving
        - genie
        - sql
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          description: "Warehouse-backed analytics (AppKit `analytics` plugin) + Delta→Lakebase sync via the SQL API."
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          description: "Lakebase Postgres pool — the OLTP mirror + the app's writable campaign_actions_app table."
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
    # Concrete IDs for the fe-sandbox-serverless-sandbox-kgi5wi workspace.
    # Kept at target level (not in the variable defaults) so the bundle stays
    # a reusable template for other workspaces.
    variables:
      catalog: serverless_sandbox_kgi5wi_catalog
      warehouse_id: 50792739f9da1305
      # Bind the app to the DEVELOPMENT branch (production branch also exists:
      # projects/birghtwave/branches/production — swap here for prod).
      # NB: the project slug is "birghtwave" (as created in the workspace).
      lakebase_branch: projects/birghtwave/branches/development
      lakebase_database: projects/birghtwave/branches/development/databases/databricks-postgres
  prod:
    mode: production
